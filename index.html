<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luyện trắc nghiệm theo cấp độ</title>
<style>
  :root{
    --ink:#1F1B3A; --ink-soft:#5F5B7A; --line:#E3E0F2; --card:#FFFFFF;
    --primary:#4F46E5; --primary-dark:#3B34B8; --primary-bg:#EEF0FF;
    --ok:#0E9F6E; --ok-bg:#E3F7EF; --bad:#E5484D; --bad-bg:#FDECEC;
    --claude:#C026A5; --claude-bg:#FBE8F6;
    --accent-1:#FF8A5B; --accent-2:#F6C453; --accent-3:#5BC0EB;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);line-height:1.5;
       background:linear-gradient(160deg,#EEF0FF 0%,#F8F6FF 45%,#FFF4EC 100%);min-height:100vh}
  .wrap{max-width:720px;margin:0 auto;padding:32px 20px 64px}
  h1{font-size:30px;margin:0 0 4px;letter-spacing:-.01em;
     background:linear-gradient(90deg,var(--primary),var(--claude));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
  .sub{color:var(--ink-soft);margin:0 0 28px}
  button{font:inherit;cursor:pointer;border-radius:12px;border:1.5px solid var(--primary);background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:11px 20px;font-weight:600;box-shadow:0 6px 16px rgba(79,70,229,.25)}
  button:hover:not(:disabled){filter:brightness(1.06)}
  button.ghost{background:transparent;color:var(--primary);box-shadow:none}
  button:focus-visible{outline:3px solid #A5B4FC;outline-offset:2px}
  button:disabled{opacity:.45;cursor:default}

  .level{display:flex;gap:16px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:14px;text-align:left;width:100%;color:var(--ink);box-shadow:0 8px 24px rgba(31,27,58,.06);position:relative;overflow:hidden}
  .level::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,var(--accent-1),var(--accent-2))}
  .level:nth-child(3n+3)::before{background:linear-gradient(180deg,var(--accent-3),var(--primary))}
  .level:nth-child(3n+4)::before{background:linear-gradient(180deg,var(--claude),var(--accent-1))}
  .level:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 12px 28px rgba(79,70,229,.15)}
  .level .num{font-size:36px;font-weight:800;line-height:1;min-width:56px;text-align:center;color:var(--primary);padding-right:16px;border-right:1.5px solid var(--line)}
  .level .t{font-weight:700;font-size:17px}
  .level .m{color:var(--ink-soft);font-size:14px;margin-top:2px}
  .level .best{margin-left:auto;font-size:13px;font-weight:600;color:var(--primary);background:var(--primary-bg);border-radius:999px;padding:5px 12px;white-space:nowrap}
  .level .best.perfect{color:#0a7a2f;background:rgba(10,122,47,.16)}
  .level .best.good{color:#92400e;background:rgba(217,119,6,.18)}
  .level .best.low{color:#b91c1c;background:rgba(229,72,77,.18)}

  .legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;font-size:14px;color:var(--ink-soft);align-items:center}
  .badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600}
  .badge.file{background:var(--primary-bg);color:var(--primary)}
  .badge.claude{background:var(--claude-bg);color:var(--claude)}

  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:14px;color:var(--ink-soft)}
  .track{height:8px;background:#E6E4F5;border-radius:4px;overflow:hidden;margin-bottom:26px}
  .track div{height:100%;background:linear-gradient(90deg,var(--primary),var(--claude));transition:width .3s}
  .q{font-size:22px;font-weight:700;margin:0 0 20px;line-height:1.4}
  .q .blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--accent-1);vertical-align:baseline}
  .opts{display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;color:var(--ink);width:100%;font-size:17px;font-weight:500;box-shadow:0 4px 14px rgba(31,27,58,.05)}
  .opt:hover:not(:disabled){border-color:var(--primary);background:var(--primary-bg)}
  .opt .k{width:30px;height:30px;border-radius:50%;background:var(--primary-bg);color:var(--primary);display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt.correct .k{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.wrong .k{background:var(--bad);color:#fff}
  .opt:disabled{opacity:1;cursor:default;box-shadow:none}
  .opt:disabled:not(.correct):not(.wrong){opacity:.5}

  .fb{margin-top:18px;border-radius:14px;padding:16px 18px;border-left:6px solid}
  .fb.ok{background:var(--ok-bg);border-color:var(--ok)}
  .fb.bad{background:var(--bad-bg);border-color:var(--bad)}
  .fb .v{font-weight:700;margin-bottom:4px;font-size:17px}
  .fb.ok .v{color:var(--ok)} .fb.bad .v{color:var(--bad)}
  .fb .vi{margin-top:10px;padding:10px 12px;background:rgba(255,255,255,.7);border-radius:10px;font-size:15px;font-style:italic;color:var(--ink)}
  .fb .src{margin-top:10px;font-size:14px}
  .fb .note{margin-top:8px;font-size:15px;color:var(--ink-soft)}
  .actions{display:flex;justify-content:space-between;margin-top:22px;gap:10px}

  .score{text-align:center;padding:28px 0 8px}
  .score .big{font-size:72px;font-weight:800;line-height:1;background:linear-gradient(90deg,var(--primary),var(--claude));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
  .score .of{color:var(--ink-soft);font-size:18px}
  .review{margin-top:24px}
  .row{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;font-size:15px;box-shadow:0 4px 14px rgba(31,27,58,.04)}
  .row.hit{border-left:6px solid var(--ok)} .row.miss{border-left:6px solid var(--bad)}
  .row .s{color:var(--ink-soft);font-size:14px;margin-top:3px}

  [data-theme="dark"]{
    --ink:#EEF0F7; --ink-soft:#A9ACC0; --line:#2A2D3E; --card:#15172A;
    --primary-bg:rgba(99,102,241,.18);
    --ok-bg:rgba(14,159,110,.18); --bad-bg:rgba(229,72,77,.18); --claude-bg:rgba(192,38,165,.2);
  }
  [data-theme="dark"] body{background:radial-gradient(1000px 500px at 15% -10%,#1C1E36 0%,#0B0C16 55%,#050609 100%)}
  [data-theme="dark"] .level{box-shadow:0 10px 30px rgba(0,0,0,.5)}
  [data-theme="dark"] .opt,[data-theme="dark"] .row{box-shadow:0 6px 18px rgba(0,0,0,.4)}
  [data-theme="dark"] .track{background:#23263A}
  [data-theme="dark"] .fb .vi{background:rgba(255,255,255,.07)}
  [data-theme="dark"] .level .best.perfect{color:#22c55e}
  [data-theme="dark"] .level .best.good{color:#fbbf24}
  [data-theme="dark"] .level .best.low{color:#f87171}
  .intro{background:var(--card);border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:14px;color:var(--ink-soft)}
  .theme{position:fixed;top:14px;right:14px;padding:8px 14px;font-size:13px;border-radius:999px;z-index:9}
  .theme.ghost{background:var(--card);border-color:var(--line);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.12)}
  @media (prefers-reduced-motion:reduce){.track div,.level{transition:none}}
</style>
</head>
<body>
<button class="theme ghost" id="themeBtn" onclick="toggleTheme()">☀ Nền sáng</button>
<div class="wrap" id="app"></div>

<script>
/* =========================================================
   DỮ LIỆU CÁC CẤP ĐỘ
   Mỗi file PDF = 1 cấp độ riêng. Không cộng dồn.
   answerSource: "file"   -> đáp án lấy từ file gốc (đã đúng)
                 "claude" -> file sai/thiếu, Claude tự tìm đáp án đúng
   ========================================================= */
const LEVELS = [
  {
    id: 1,
    title: "Unit 1A – Grammar & Vocabulary",

    questions: [
      { q: "We aren't going to Emma and Ian's wedding. They haven't invited ___.",

        note: "Hai cháu gái (số nhiều) → their.",

      { q: "Do you know where my keys are? I can't find ___.",
        options: ["They","His","Them"], answer: 2, answerSource: "file",
        note: "'find' cần tân ngữ, keys số nhiều → them.",

      { q: "I'm staying at my sister's house when I'm in the UK. I always stay with ___.",

      { q: "It's my dad's birthday tomorrow. I mustn't forget to call ___.",

        note: "Dad (nam) làm tân ngữ → him.",

      { q: "We go everywhere by public transport. The bus stops right outside ___ house.",
        options: ["Their","We","Our"], answer: 2, answerSource: "file",
        note: "Trước danh từ 'house' cần tính từ sở hữu → our.",

  {

        note: "Theo bài nghe, họ của Sean là Gibson. 'Sean Connery' chỉ là diễn viên mà anh được đặt tên theo, không phải tên anh.",
        vi: "Tên đầy đủ của Sean là gì? → Sean Gibson." },
      { q: "Why did Sean's parents call him that?",

        vi: "Vì sao Deborah được đặt tên theo một bệnh viện? → Vì cô sinh ra ở bệnh viện Deborah, bang New Jersey." },
      { q: "What nickname does Deborah have?",
        options: ["Debbie or Deb","Deb","Deborah-Ann"], answer: 0, answerSource: "file",
        note: "Bạn bè gọi cô là Debbie hoặc Deb — cả hai đều được nhắc trong bài nghe, nên đáp án 'Deb' một mình chưa đủ.",
        vi: "Deborah có biệt danh gì? → Debbie hoặc Deb." },
      { q: "What is James's full name?",

      { q: "Why did James's parents choose the name James?",
        options: ["They named him after someone in the family","It was a popular name at the time","They liked it"], answer: 2, answerSource: "file",
        note: "Bố mẹ James chọn tên đơn giản vì họ thích nó, không theo truyền thống gia đình hay trào lưu.",
        vi: "Vì sao bố mẹ James chọn tên James? → Vì họ thích cái tên đó." },
      { q: "Why did Philippa's parents choose her name?",

        note: "Bố mẹ Philippa nghe thấy tên này khi đang sống ở Anh (England) và thích nó.",

    ]
  },
  {
    id: 3,
    title: "Unit 1A – Reading",
    source: "03-Unit_1A_-_Reading_Quiz.pdf",

        <div>
          <div class="t">${esc(l.title)}</div>
          <div class="m">${esc(l.topic)} · ${n} câu${c?` · ${c} đáp án do cá nhân tự tìm`:''}</div>
          <div class="m">Nguồn: ${esc(l.source)}</div>
        </div>
        <div class="best ${bestCls}">${bset!=null?`Cao nhất ${bset}/${n}`:'Chưa làm'}</div>
      </button>`;
    }).join('')}
    <div class="legend">
      <span class="badge file">Đáp án từ file gốc</span>
      <span class="badge claude">✦ Đáp án này do cá nhân tự tìm</span>
      <span>— hiển thị ở mỗi câu để bạn biết nguồn đáp án</span>
    </div>`;
}

function start(id){
  const level = LEVELS.find(l=>l.id===id);
  state = { level, i:0, wrongs:[], solved:false, results:[] };
  question();
}

function question(){
  const {level,i,wrongs,solved} = state;
  const q = level.questions[i];
  app.innerHTML = `
    <div class="bar">
      <button class="ghost" onclick="home()" style="padding:6px 12px">← Cấp độ</button>
      <span>Cấp ${level.id} · Câu ${i+1}/${level.questions.length}</span>
    </div>
    <div class="track"><div style="width:${(i/level.questions.length)*100}%"></div></div>
    ${level.intro?`<div class="intro">${esc(level.intro)}</div>`:''}
    <p class="q">${blank(q.q)}</p>
    <div class="opts">
      ${q.options.map((o,k)=>{
        let cls='opt', dis=false;
        if(solved){ dis=true; if(k===q.answer) cls+=' correct'; else if(wrongs.includes(k)) cls+=' wrong'; }
        else if(wrongs.includes(k)){ cls+=' wrong'; dis=true; }
        return `<button class="${cls}" ${dis?'disabled':''} onclick="pick(${k})">
          <span class="k">${'abc'[k]}</span><span>${esc(o)}</span></button>`;
      }).join('')}
    </div>
    ${solved?`
      <div class="fb ok">
        <div class="v">${wrongs.length?'Đúng rồi (sau '+wrongs.length+' lần sai).':'Chính xác ngay lần đầu.'}</div>
        <div class="note"><strong>Vì sao chọn "${esc(q.options[q.answer])}":</strong> ${esc(q.note||'')}</div>
        ${q.vi?`<div class="vi">${esc(q.vi)}</div>`:''}
        <div class="src">${srcBadge(q)}${q.answerSource==='claude'?' — file gốc ghi sai hoặc thiếu, đáp án này không lấy từ nguồn bạn gửi.':''}</div>
      </div>
      <div class="actions">
        <span></span>
        <button onclick="next()">${i+1<level.questions.length?'Câu tiếp theo':'Xem kết quả'}</button>
      </div>`
    : wrongs.length?`
      <div class="fb bad">
        <div class="v">Chưa đúng. Hãy chọn lại.</div>
        <div class="note">Còn ${q.options.length-wrongs.length} lựa chọn. Chỉ sang câu tiếp khi chọn đúng.</div>
      </div>`:''}
  `;
}

function pick(k){
  if(state.solved) return;
  if(k===state.level.questions[state.i].answer){
    state.solved = true;
    state.results.push(state.wrongs.length); // số lần sai trước khi đúng
  } else if(!state.wrongs.includes(k)){
    state.wrongs.push(k);
  }
  question();
}

function next(){
  state.i++; state.wrongs=[]; state.solved=false;
  if(state.i<state.level.questions.length) question(); else finish();
}

function finish(){
  const {level,results} = state;
  const score = results.filter(w=>w===0).length, n = level.questions.length;
  best[level.id] = Math.max(best[level.id]||0, score);
  app.innerHTML = `
    <div class="bar"><button class="ghost" onclick="home()" style="padding:6px 12px">← Cấp độ</button><span>Cấp ${level.id} · Kết quả</span></div>
    <div class="score"><div><span class="big"${score===n?' style="background:none;-webkit-text-fill-color:#0a7a2f;color:#0a7a2f"':''}>${score}</span><span class="of" style="font-size:28px"> / ${n}</span></div>
      <div class="of">Số câu đúng ngay lần đầu. ${score===n?'<span style="color:#0a7a2f;font-weight:700">Trọn vẹn, sẵn sàng cho cấp độ tiếp theo.</span>':score>=n*0.7?'Khá tốt, xem lại các câu phải chọn lại bên dưới.':'Ôn lại phần này rồi thử lại nhé.'}</div></div>
    <div class="actions" style="justify-content:center">
      <button class="ghost" onclick="home()">Chọn cấp độ khác</button>
      <button onclick="start(${level.id})">Làm lại cấp ${level.id}</button>
    </div>
    <div class="review">
      ${level.questions.map((q,k)=>`
        <div class="row ${results[k]===0?'hit':'miss'}">
          <div>${k+1}. ${esc(q.q.replace('___','['+q.options[q.answer]+']'))}</div>
          <div class="s">${results[k]===0?'Đúng ngay lần đầu':'Đúng sau '+results[k]+' lần sai'} · ${srcBadge(q)}</div>
        </div>`).join('')}
    </div>`;
}

function toggleTheme(){
  const h=document.documentElement, dark=h.getAttribute('data-theme')==='dark';
  h.setAttribute('data-theme', dark?'light':'dark');
  document.getElementById('themeBtn').textContent = dark?'☾ Nền đen':'☀ Nền sáng';
}
home();
</script>
</body>
</html>
